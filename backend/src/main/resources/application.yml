spring:
  application:
    name: ezproject
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    # Origines autorisées (frontend). En dev, le proxy Vite rend l'appel same-origin.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
