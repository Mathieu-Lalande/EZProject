spring:
  application:
    name: ezproject
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Migrations communes + migrations propres au SGBD (ex. Row-Level Security pour PostgreSQL)
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  servlet:
    multipart:
      # Pièces jointes (5 Mo) ; l'import CSV applique en plus sa propre limite de 2 Mo
      max-file-size: 5MB
      max-request-size: 6MB

server:
  # Les hébergeurs PaaS (Render, Heroku…) imposent le port via la variable PORT
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      # Expiration après inactivité (SESSION_TIMEOUT, ex. 30m, 8h)
      timeout: ${SESSION_TIMEOUT:8h}
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        # /actuator/prometheus est en plus protégé par jeton (METRICS_TOKEN), voir MetricsTokenFilter
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      # Vérifié seulement si Redis est utilisé
      enabled: ${REDIS_ENABLED:false}
  metrics:
    tags:
      application: ezproject

app:
  redis:
    # true = compteurs anti-abus et événements temps réel partagés entre instances (SPRING_DATA_REDIS_HOST/PORT/PASSWORD)
    enabled: ${REDIS_ENABLED:false}
  rls:
    # Row-Level Security PostgreSQL (sans effet sur H2)
    enabled: ${RLS_ENABLED:true}
  metrics:
    # Jeton exigé par /actuator/prometheus (Authorization: Bearer ...). Vide = endpoint désactivé.
    token: ${METRICS_TOKEN:}
  mfa:
    # 32 octets en Base64 (ex. : openssl rand -base64 32). Sans clé, la double authentification est indisponible.
    encryption-key: ${MFA_ENCRYPTION_KEY:}
  rate-limit:
    enabled: true
    login-ip: { capacity: 20, window: 10m }
    # Après 5 échecs, le compte est bloqué ; un essai redevient possible au fil de la recharge (1 toutes les 3 min)
    login-account: { capacity: 5, window: 15m }
    signup-ip: { capacity: 5, window: 1h }
    import-user: { capacity: 20, window: 1h }
    api-user: { capacity: 600, window: 1m }
    api-anonymous: { capacity: 120, window: 1m }
  cors:
    # Origines autorisées (frontend). En dev, le proxy Vite rend l'appel same-origin.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
