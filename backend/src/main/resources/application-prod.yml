spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  servlet:
    session:
      cookie:
        secure: true

app:
  seed:
    enabled: false
  bootstrap-admin:
    # Crée un administrateur au premier démarrage si aucun utilisateur n'existe.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
