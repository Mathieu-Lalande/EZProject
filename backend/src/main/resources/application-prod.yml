spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  # Derrière un reverse proxy de confiance (nginx, load balancer) : FORWARD_HEADERS_STRATEGY=native
  # pour que l'IP client (limitation anti-abus) et le schéma HTTPS soient correctement détectés.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      cookie:
        secure: true

app:
  seed:
    enabled: false
  bootstrap-admin:
    # Crée un administrateur au premier démarrage si aucun utilisateur n'existe.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    organization: ${ADMIN_ORGANIZATION:Mon organisation}
