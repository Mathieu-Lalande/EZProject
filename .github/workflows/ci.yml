name: CI

# Économie de minutes : une seule exécution par PR (pas de doublon push + pull_request),
# rien pour la documentation seule, et une exécution remplacée annule la précédente.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Active les tests du mode multi-instances (RedisIntegrationTest est ignoré sans Redis)
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Bout en bout : jar unique (API + interface) sur PostgreSQL avec Row-Level Security, parcours API puis navigateur
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ezproject
          POSTGRES_USER: ezproject
          POSTGRES_PASSWORD: ezproject-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ezproject -d ezproject" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Construire le jar complet
        working-directory: backend
        run: ./mvnw -B -Pfullstack -DskipTests package
      - name: Démarrer l'application (profil local, PostgreSQL)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: local
          DB_URL: jdbc:postgresql://localhost:5432/ezproject
        run: |
          nohup java -jar target/ezproject-backend-*.jar > app.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/actuator/health/readiness && exit 0
            sleep 2
          done
          cat app.log
          exit 1
      - name: Parcours API
        run: python3 e2e/api_smoke.py
      - name: Parcours navigateur
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node ui_smoke.cjs
      - name: Journal de l'application en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: backend/app.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ezproject:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
